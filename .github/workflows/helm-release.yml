name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - "helm-charts/bifrost/**"
      - ".github/workflows/helm-release.yml"
  workflow_dispatch:

env:
  # Temporary exception tracked in .github/action-runtime-exceptions.json.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# One publication at a time, never cancelled: two runs that both read the
# published index at the same revision would otherwise let the later Pages
# push replace the earlier run's entry.
concurrency:
  group: helm-chart-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Every write below (GitHub release, Pages, OCI) shares this gate, so a
    # manual dispatch from another branch can never occupy a release version.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1.5.0'
    runs-on: ${{ vars.BIFROST_RUNNER_AMD64 || 'ubuntu-24.04' }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            get.helm.sh:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.0.0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.0"

      - name: Run chart-testing (lint)
        run: |
          helm lint helm-charts/bifrost

      - name: Validate Helm templates
        run: |
          chmod +x .github/workflows/scripts/validate-helm-templates.sh
          .github/workflows/scripts/validate-helm-templates.sh

      - name: Validate Helm config fields
        run: |
          chmod +x .github/workflows/scripts/validate-helm-config-fields.sh
          .github/workflows/scripts/validate-helm-config-fields.sh

      - name: Validate Go ↔ config.schema.json ↔ helm-chart sync (schemasync)
        run: |
          chmod +x .github/workflows/scripts/validate-schema-sync.sh
          .github/workflows/scripts/validate-schema-sync.sh

      - name: Get chart version
        id: chart-version
        run: |
          VERSION=$(grep '^version:' helm-charts/bifrost/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Chart version: $VERSION"

      - name: Check if release exists
        id: check-release
        run: |
          if gh release view "helm-chart-v${{ steps.chart-version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: |
          cd helm-charts
          helm package bifrost

      - name: Create GitHub Release
        if: steps.check-release.outputs.exists == 'false'
        run: |
          cd helm-charts
          gh release create "helm-chart-v${{ steps.chart-version.outputs.version }}" \
            bifrost-${{ steps.chart-version.outputs.version }}.tgz \
            --target ${{ github.sha }} \
            --title "Helm Chart v${{ steps.chart-version.outputs.version }}" \
            --notes "Helm chart release for Bifrost v${{ steps.chart-version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The release asset is the canonical tarball for this chart version, so the
      # index entry has to carry its digest and URL. A rerun repackages the chart
      # with different bytes, which is why the index is built from the asset
      # rather than from the local package (TXE-4820).
      - name: Fetch canonical chart release asset
        id: release-asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.chart-version.outputs.version }}
        run: |
          asset_dir="$RUNNER_TEMP/helm-release-asset"
          rm -rf "$asset_dir"
          gh release download "helm-chart-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "bifrost-$VERSION.tgz" \
            --dir "$asset_dir"
          echo "path=$asset_dir/bifrost-$VERSION.tgz" >> "$GITHUB_OUTPUT"

      # Merges this release into THIS repository's published index - the gh-pages
      # branch the deploy step below pushes to - never an upstream one, and fails
      # rather than publish on any error, so history is never replaced by an
      # empty or foreign index. The rules are in the script header.
      - name: Update Helm repository index
        env:
          VERSION: ${{ steps.chart-version.outputs.version }}
          RELEASE_ASSET: ${{ steps.release-asset.outputs.path }}
        run: |
          chmod +x .github/workflows/scripts/helm-publish-index.sh
          .github/workflows/scripts/helm-publish-index.sh \
            --chart-name bifrost \
            --chart-version "$VERSION" \
            --release-tag "helm-chart-v$VERSION" \
            --canonical-chart "$RELEASE_ASSET" \
            --local-chart "helm-charts/bifrost-$VERSION.tgz" \
            --repository "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL" \
            --remote origin \
            --publish-branch gh-pages \
            --index-path helm-charts/index.yaml \
            --output helm-charts/index.yaml \
            --base-sha-output "$RUNNER_TEMP/helm-index-base-sha"

      # The job is serialized, but a push to gh-pages from outside this workflow
      # could still land between the index read and the deploy step's own clone.
      # Refuse to deploy over it; a re-run rebuilds the index from it.
      - name: Verify publish branch unchanged
        run: |
          chmod +x .github/workflows/scripts/helm-publish-index-verify.sh
          .github/workflows/scripts/helm-publish-index-verify.sh \
            --remote origin \
            --publish-branch gh-pages \
            --base-sha-file "$RUNNER_TEMP/helm-index-base-sha"

      # keep_files: false clears only destination_dir (helm-charts/) in the
      # publish branch before copying publish_dir in; anything published outside
      # it stays. The index above carries every previously published version.
      - name: Deploy to GitHub Pages
        uses: step-security/actions-gh-pages@db28a5e317d585916043c4acc5a4319ab3da9275 # v4.0.1
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1.5.0'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./helm-charts
          destination_dir: helm-charts
          keep_files: false
          enable_jekyll: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Login to GitHub Container Registry
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.check-release.outputs.exists == 'false'
        continue-on-error: true
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Publishes under the owner this workflow runs in, never a hardcoded
      # organisation. The registry is asked on every attempt: a missing version
      # is pushed from the canonical asset and read back, an identical one is
      # left alone, a different one or any registry error fails the job. This
      # does not depend on whether the GitHub release pre-existed, so a re-run
      # after a failed deploy still publishes the artifact.
      - name: Push Helm chart as OCI artifact to GHCR
        env:
          VERSION: ${{ steps.chart-version.outputs.version }}
          RELEASE_ASSET: ${{ steps.release-asset.outputs.path }}
        run: |
          chmod +x .github/workflows/scripts/helm-publish-oci.sh
          .github/workflows/scripts/helm-publish-oci.sh \
            --chart-name bifrost \
            --chart-version "$VERSION" \
            --canonical-chart "$RELEASE_ASSET" \
            --registry ghcr.io \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repository-path helm-charts

      # - name: Push Helm chart as OCI artifact to Docker Hub
      #   env:
      #     VERSION: ${{ steps.chart-version.outputs.version }}
      #     RELEASE_ASSET: ${{ steps.release-asset.outputs.path }}
      #   run: |
      #     .github/workflows/scripts/helm-publish-oci.sh \
      #       --chart-name bifrost \
      #       --chart-version "$VERSION" \
      #       --canonical-chart "$RELEASE_ASSET" \
      #       --registry registry-1.docker.io \
      #       --owner "${{ secrets.DOCKER_USERNAME }}" \
      #       --repository-path helm-charts
